[project]
name = "proxy-rotator"
version = "0.1.0"
description = "Local proxy pool manager with rotation + health checks + burn detection."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I", "B", "UP", "N", "SIM", "RET", "S"]
extend-ignore = ["S101"]  # assert usage in tests is fine

[tool.ruff.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
