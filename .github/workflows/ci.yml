name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests (offline upstream fixtures only)
        run: pytest -q
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Blocking: docs/SECURITY.md previously promised this step while the
      # workflow did not run it, which let 49 advisories accumulate unnoticed.
      - name: pip-audit
        run: pip-audit -r requirements.txt

  windows-browser-engines:
    name: Windows browser engines
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and real engines
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium firefox webkit
      - name: Real browser HTTP and HTTPS through synthetic proxies
        env:
          RUN_BROWSER_ENGINES: '1'
          GATEWAY_HTTP_PORT: '0'
          GATEWAY_SOCKS_PORT: '0'
        run: python -m pytest -q tests/test_browser_engines.py
